# MOCL 兼容层 —— DSH profile patch（路线 A：旁路插件）
# 用法（不要直接写用户 profile；由 HANDOFF §3.0 的启用步骤执行）：
#   dsh --profile headless --patch "$PWD/impl/patch/cordis.patch.yml" --dump-config
# 基线：DSH 0.2.1-rc.3（host API 升级需复核 src/plugin/dsh-types.d.ts）
#
# 只新增：
# - `insert:` 段新增 MOCL 插件行（id 唯一，name 为包名）；
# - `config.toolNames` 是**声明式清单**（宿主实际工具名由插件 apply 注册）；
# - 旧的一次性 codex/claude 工具停用见 `disable-legacy.yml`（R25 冲突规避）。
- insert:
    - id: mocl
      name: '@mocl/dsh-plugin'
      config:
        configPath: config.default.json
        toolNames:
          subagent_agent:
            backends: [codex, claude-code, kimi, opencode]
            maxDepth: provider-managed
            defaultPermissionMode: read-only
          mocl_status:
            cursor: true
            exposeRemoteIdState: true
